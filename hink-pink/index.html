<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hink Pink — Multiplayer</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#20243a;background:#f7f5ef;--p:#6c55e8;--y:#ddf27b;--s:#fff;--m:#6c7082;--l:#ddd9d0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f5ef,#eeeafd);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:28px 18px 50px}.brand{font-weight:900;font-size:1.2rem;margin-bottom:28px}.brand b{background:var(--p);color:white;padding:8px 11px;border-radius:12px;margin-right:8px}.card{background:var(--s);border:1px solid var(--l);border-radius:22px;padding:28px;box-shadow:0 15px 45px #26214512}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:clamp(2.3rem,7vw,4rem);letter-spacing:-.07em;margin:.3em 0}.accent{color:var(--p)}p{color:var(--m);line-height:1.55}.grid{display:grid;gap:12px}.row{display:flex;gap:9px;align-items:center}.input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;background:white;font:inherit}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--p);color:white;font-weight:850;cursor:pointer}.btn.secondary{background:white;color:#20243a;border:1px solid var(--l)}.btn:disabled{opacity:.45}.seg{display:flex;gap:8px}.seg .btn{flex:1;background:white;color:#20243a;border:1px solid var(--l)}.seg .on{background:#efecff;color:var(--p);border-color:var(--p)}.center{text-align:center}.small{font-size:.8rem;color:var(--m)}.pill{display:inline-block;padding:6px 10px;border:1px solid var(--l);border-radius:99px;font-size:.75rem;color:var(--m)}.clue{background:var(--y);border-radius:18px;padding:25px;font-size:clamp(1.5rem,5vw,2.5rem);font-weight:900;margin:20px 0}.score{font-size:2rem;font-weight:900;color:var(--p)}.answer{background:var(--y);padding:20px;border-radius:18px;font-size:2rem;font-weight:900}.danger{color:#b94250}.good{color:#20815a}.board{display:grid;gap:8px;margin:18px 0}.board>div{display:flex;justify-content:space-between;padding:13px 15px;background:#f0eee8;border-radius:12px}.hidden{display:none}.timer{font-variant-numeric:tabular-nums;font-weight:900}.bar{height:6px;background:#e8e5dd;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--p);transform-origin:left;transform:scaleX(1)}@media(max-width:560px){.card{padding:20px}.row{align-items:stretch}.seg{flex-direction:column}}
</style></head><body><div class="wrap"><div class="brand"><b>hp!</b> Hink Pink</div><div id="app"></div></div><script>
'use strict';const A=document.getElementById('app');let P=[{id:1,n:'You',s:0,sp:0,gp:0},{id:2,n:'Player 2',s:0,sp:0,gp:0},{id:3,n:'Player 3',s:0,sp:0,gp:0}],dur=75,phase='setup',order=[],ri=0,R=null,tick=null;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const by=id=>P.find(x=>x.id===id), setter=()=>by(order[ri%order.length]), rounds=()=>P.length*2;function norm(x){return String(x).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).filter(x=>!['a','an','the'].includes(x)).map(x=>x.length>4&&x.endsWith('ies')?x.slice(0,-3)+'y':x.length>4&&x.endsWith('es')&&!x.endsWith('ses')?x.slice(0,-2):x.length>3&&x.endsWith('s')&&!x.endsWith('ss')?x.slice(0,-1):x)}function correct(a,b){a=norm(a);b=norm(b);return a.length===2&&b.length===2&&((a[0]===b[0]&&a[1]===b[1])||(a[0]===b[1]&&a[1]===b[0]))}function mix(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function remain(){return Math.max(0,R.ends-Date.now())}function fmt(ms){let s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function startClock(){if(R.start)return;R.start=Date.now();R.ends=R.start+dur*1000;tick=setInterval(clock,200)}function clock(){if(!R)return;let m=remain();document.querySelectorAll('.timer').forEach(x=>x.textContent=fmt(m));let b=document.querySelector('.bar i');if(b)b.style.transform=`scaleX(${Math.max(0,m/(dur*1000))})`;if(m<=0)reveal('time')}function stop(){clearInterval(tick);tick=null}function guessers(){return P.filter(x=>x.id!==R.sid)}function active(){for(let i=0;i<R.go.length;i++){let id=R.go[(R.cur+i)%R.go.length];if(!R.solved.includes(id))return R.cur=(R.go.indexOf(id)),id}return null}function setup(){A.innerHTML=`<div class="hero"><span class="pill">Pass-and-play · 3–8 players</span><h1>Two words.<br><span class="accent">One perfect rhyme.</span></h1><p>Set sneaky clues, pass one device, and race the clock. Everyone sets twice.</p></div><div class="card"><h2>Set up your game</h2><div id="players" class="grid">${P.map((p,i)=>`<div class="row"><b>${i+1}</b><input class="input pn" data-id="${p.id}" value="${esc(p.n)}" maxlength="28">${P.length>3?`<button class="btn secondary rm" data-id="${p.id}">×</button>`:''}</div>`).join('')}</div><button class="btn secondary" id="add">＋ Add player</button><hr><b>Round timer</b><div class="seg" style="margin:9px 0 18px">${[60,75,90].map(x=>`<button class="btn ${dur===x?'on':''}" data-d="${x}">${x}s</button>`).join('')}</div><button class="btn" id="go">Draw setter order →</button><p class="small">Scoring: guessers earn 1–5 based on time remaining. Setters earn round(24·p·(1−p)); ties break on setter points.</p></div>`;document.querySelectorAll('.pn').forEach(x=>x.oninput=()=>by(+x.dataset.id).n=x.value);document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{dur=+x.dataset.d;setup()});document.getElementById('add').onclick=()=>{if(P.length<8){P.push({id:Date.now(),n:'Player '+(P.length+1),s:0,sp:0,gp:0});setup()}};document.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{P=P.filter(p=>p.id!==+x.dataset.id);setup()});document.getElementById('go').onclick=()=>{let names=P.map(p=>p.n.trim().toLowerCase());if(P.some(p=>!p.n.trim())||new Set(names).size<P.length)return alert('Every player needs a unique name.');P.forEach(p=>{p.s=p.sp=p.gp=0});order=mix(P.map(p=>p.id));ri=0;handoffSetter()}}function handoffSetter(){phase='setter';A.innerHTML=`<div class="card center"><span class="pill">Round ${ri+1} of ${rounds()}</span><h1>Pass the device to<br>${esc(setter().n)}</h1><p>Everyone else, look away while the setter writes the clue and answer.</p><button class="btn" id="open">I'm ${esc(setter().n)} — open setter desk</button></div>`;document.getElementById('open').onclick=setterDesk}function setterDesk(){A.innerHTML=`<div class="card"><span class="pill">Private setter desk</span><h1>Make them think.</h1><p>Use a two-word rhyming answer. Clue writing is untimed.</p><label>Clue</label><input class="input" id="clue" placeholder="An overweight feline"><br><br><label>Secret answer</label><input class="input" id="ans" placeholder="fat cat"><br><button class="btn" id="lock" style="margin-top:15px">Lock answer & start →</button><p id="err" class="danger"></p></div>`;document.getElementById('lock').onclick=()=>{let c=document.getElementById('clue').value.trim(),a=document.getElementById('ans').value.trim();if(!c||norm(a).length!==2)return document.getElementById('err').textContent='Enter a clue and an answer that normalizes to exactly two words.';let pos=P.findIndex(p=>p.id===setter().id);R={n:ri+1,sid:setter().id,clue:c,ans:a,go:[],cur:0,solved:[],awards:[],start:null,ends:null};for(let i=1;i<P.length;i++)R.go.push(P[(pos+i)%P.length].id);handoffGuess()}}function handoffGuess(){let id=active();if(id==null)return reveal('everyone');A.innerHTML=`<div class="card center"><span class="pill">Solved ${R.solved.length} / ${R.go.length}</span><h1>Pass to ${esc(by(id).n)}</h1><p>The clue and guesses are private. The clock starts when the first guesser opens it.</p><button class="btn" id="open">I'm ${esc(by(id).n)} — reveal clue</button></div>`;document.getElementById('open').onclick=guessDesk}function guessDesk(){startClock();let id=active();A.innerHTML=`<div class="card center"><div><span class="pill">${esc(by(id).n)} · Solved ${R.solved.length}/${R.go.length}</span> <span class="pill timer">${fmt(remain())}</span></div><div class="bar"><i></i></div><div class="clue">${esc(R.clue)}</div><form id="f"><input class="input" id="g" autofocus placeholder="Your two-word guess"><button class="btn" style="margin-top:10px">Submit guess</button></form><p id="fb"></p><button class="btn secondary" id="done">Done / pass device</button><p class="small">You may guess as many times as you want. If you solve it, you're locked out for this round.</p></div>`;document.getElementById('f').onsubmit=e=>{e.preventDefault();let g=document.getElementById('g').value.trim();if(norm(g).length!==2)return document.getElementById('fb').textContent='Use exactly two words.';if(correct(g,R.ans)){let pts=1+Math.round(4*remain()/(dur*1000));R.solved.push(id);R.awards.push({id,pts});by(id).s+=pts;by(id).gp+=pts;document.getElementById('fb').innerHTML=`<span class="good">✓ Correct! +${pts} points.</span>`;document.getElementById('f').classList.add('hidden');document.getElementById('done').textContent='Hide result & pass device';if(R.solved.length===R.go.length)return setTimeout(()=>reveal('everyone'),350)}else document.getElementById('fb').innerHTML='<span class="danger">× Not quite. Try again.</span>';document.getElementById('g').value='';document.getElementById('g').focus()};document.getElementById('done').onclick=()=>{if(remain()<=0)return reveal('time');handoffGuess()};clock()}function reveal(reason){if(!R)return;stop();let p=R.solved.length/R.go.length,sp=Math.round(24*p*(1-p));by(R.sid).s+=sp;by(R.sid).sp+=sp;let rows=guessers().map(x=>{let a=R.awards.find(y=>y.id===x.id);return `<div><span>${esc(x.n)}</span><b>${a?'+'+a.pts:'0'} pts</b></div>`}).join('');A.innerHTML=`<div class="card center"><span class="pill">Round ${R.n} complete</span><h1>The reveal.</h1><div class="answer">${esc(R.ans)}</div><p>${R.solved.length} of ${R.go.length} solved · Setter ${esc(by(R.sid).n)} earns <b>+${sp}</b></p><div class="board">${rows}</div><button class="btn" id="next">${ri+1<rounds()?'Next round →':'Final scoreboard →'}</button></div>`;document.getElementById('next').onclick=()=>{if(ri+1<rounds()){ri++;R=null;handoffSetter()}else gameover()}}function gameover(){let Q=P.slice().sort((a,b)=>b.s-a.s||b.sp-a.sp||a.n.localeCompare(b.n));A.innerHTML=`<div class="card center"><span class="pill">${rounds()} rounds complete</span><h1>${esc(Q[0].n)} wins! 🏆</h1><p>Ties are broken by setter points.</p><div class="board">${Q.map((p,i)=>`<div><span>${i+1}. ${esc(p.n)}<small> · setter ${p.sp} / guesser ${p.gp}</small></span><b>${p.s}</b></div>`).join('')}</div><button class="btn" id="again">Play again</button></div>`;document.getElementById('again').onclick=()=>setup()}setup();
</script></body></html>
