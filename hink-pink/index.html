(function(){'use strict';const appContent=document.getElementById('app-content'),MAX_PLAYERS=8;let players=[{id:'p1',name:'You',score:0,setterPoints:0,guesserPoints:0},{id:'p2',name:'Player 2',score:0,setterPoints:0,guesserPoints:0},{id:'p3',name:'Player 3',score:0,setterPoints:0,guesserPoints:0}],duration=75,phase='setup',order=[],roundIndex=0,currentRound=null,history=[],timerHandle=null,setupError='',setterError='',guessError='';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s)),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const by=id=>players.find(p=>p.id===id),currentSetterId=()=>order[roundIndex%order.length],currentSetter=()=>by(currentSetterId()),totalRounds=()=>players.length*2,initials=n=>n.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();function norm(x){return String(x).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/['’]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).filter(w=>!['a','an','the'].includes(w)).map(w=>w.length>4&&w.endsWith('ies')?w.slice(0,-3)+'y':w.length>4&&w.endsWith('es')&&!w.endsWith('ses')?w.slice(0,-2):w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w)}function correct(a,b){a=norm(a);b=norm(b);return a.length===2&&b.length===2&&((a[0]===b[0]&&a[1]===b[1])||(a[0]===b[1]&&a[1]===b[0]))}function mix(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}function clearTimer(){if(timerHandle!==null){clearInterval(timerHandle);timerHandle=null}}function remain(){if(!currentRound||currentRound.ends===null)return duration*1000;return Math.max(0,currentRound.ends-Date.now())}function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function tick(){if(!currentRound||currentRound.startedAt===null)return;const r=remain();$$('.timer-value').forEach(e=>e.textContent=fmt(r));$$('.timebar i').forEach(e=>e.style.setProperty('--timer-progress',Math.max(0,Math.min(1,r/(currentRound.duration*1000)))));if(r<=0&&['guess-handoff','guess-private'].includes(phase))reveal('time')}function beginTimer(){currentRound.startedAt=Date.now();currentRound.ends=currentRound.startedAt+currentRound.duration*1000;clearTimer();timerHandle=setInterval(tick,200);tick()}function active(){if(!currentRound)return null;for(let o=0;o<currentRound.guessOrder.length;o++){const i=(currentRound.cursor+o)%currentRound.guessOrder.length,id=currentRound.guessOrder[i];if(!currentRound.solvedIds.includes(id)){currentRound.cursor=i;return id}}return null}function guessers(){return players.filter(p=>currentRound&&p.id!==currentRound.setterId)}function startGame(){const ns=players.map(p=>p.name.trim());if(ns.some(n=>!n)){setupError='Give every player a name before starting.';return render()}if(new Set(ns.map(n=>n.toLowerCase())).size!==ns.length){setupError='Each player needs a different name.';return render()}players=players.map((p,i)=>({...p,name:ns[i],score:0,setterPoints:0,guesserPoints:0}));order=mix(players.map(p=>p.id));roundIndex=0;currentRound=null;history=[];setupError='';phase='setter-handoff';render()}function addPlayer(){if(players.length<MAX_PLAYERS){players.push({id:`p${Date.now()}${Math.random()}`,name:`Player ${players.length+1}`,score:0,setterPoints:0,guesserPoints:0});render()}}function setupMarkup(){const rows=players.map((p,i)=>`<div class="player-row"><span class="player-number">${String(i+1).padStart(2,'0')}</span><input class="input player-name-input" maxlength="28" value="${esc(p.name)}" data-id="${esc(p.id)}">${players.length>3?`<button class="remove-player" data-remove="${esc(p.id)}">×</button>`:''}</div>`).join('');return `<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">hp!</div><div><div class="brand-name">Hink Pink</div><div class="brand-sub">A game of rhyme & reason</div></div></div><div class="top-actions"><span class="pill"><span class="dot"></span> Local multiplayer</span></div></header><section class="hero"><div><div class="eyebrow">The party game for quick thinkers</div><h1>Two words.<br><span class="accent">One perfect rhyme.</span></h1><p class="lede">Write a sneaky clue, pass the device, and race to crack the rhyming pair. Everyone gets two turns as setter.</p></div><aside class="hero-note"><div class="note-kicker">A little Hink Pink example</div><div><div class="note-clue">An overweight feline</div><div class="note-answer">Answer: fat cat</div></div></aside></section><div class="grid-main"><section class="panel"><div class="panel-inner"><div class="panel-head"><div><h2 class="panel-title">Set up your game</h2><p class="panel-desc">Grab 3–8 players and one shared device.</p></div><span class="step-count">01 / SETUP</span></div><label class="field-label">Who's playing?</label><div class="players-list">${rows}</div><button class="add-player" id="add-player" ${players.length>=MAX_PLAYERS?'disabled':''}>＋ Add a player</button><div class="divider"></div><label class="field-label">Guessing round timer</label><div class="segmented">${[60,75,90].map(s=>`<button class="segment ${duration===s?'selected':''}" data-duration="${s}">${s}s<small>${s===60?'Quickfire':s===75?'Balanced':'Chill pace'}</small></button>`).join('')}</div><p class="field-hint">The clock starts when the first guesser opens the clue. Clue-writing is untimed.</p>${setupError?`<p class="error-message">${esc(setupError)}</p>`:''}<button class="primary-button full" id="start-game">Draw setter order →</button></div></section><aside class="panel side-panel"><h2 class="side-title">How a round works</h2><div class="rule-list"><div class="rule-item"><div class="rule-icon">✎</div><div><div class="rule-name">1. Set a clue</div><p class="rule-text">The setter enters a clue and its two-word rhyming answer in private.</p></div></div><div class="rule-item"><div class="rule-icon">↔</div><div><div class="rule-name">2. Guess privately</div><p class="rule-text">Guess as many times as you want. Only you see whether a guess is correct.</p></div></div><div class="rule-item"><div class="rule-icon">✓</div><div><div class="rule-name">3. Lock solved players</div><p class="rule-text">Solve it and you're locked out. Everyone else keeps guessing.</p></div></div><div class="rule-item"><div class="rule-icon">★</div><div><div class="rule-name">4. Reveal & score</div><p class="rule-text">At the buzzer—or when everyone solves—reveal the answer and score.</p></div></div></div><div class="scoring-mini"><b>Guessing points · up to 5</b><div class="score-samples" style="margin-top:.7rem"><div class="score-sample"><div class="score-big">5</div><div class="score-small">Instant</div></div><div class="score-sample"><div class="score-big">3</div><div class="score-small">Halfway</div></div><div class="score-sample"><div class="score-big">1</div><div class="score-small">Buzzer</div></div></div><p class="footnote">Setter points reward a clue that some—but not all—guessers solve. Ties break on setter points.</p></div></aside></div></div>`}function setterHandoffMarkup(){const s=currentSetter();return `<div class="shell"><div class="game-wrap"><div class="game-top"><span class="pill">Round ${roundIndex+1} of ${totalRounds()}</span><span class="pill">Setter: ${esc(s.name)}</span></div><section class="panel game-panel"><div class="game-content center"><div class="big-icon">✎</div><div class="overline">Setter handoff</div><h1 class="game-heading">Pass the device<br>to the setter.</h1><p class="game-copy">Everyone else, look away while ${esc(s.name)} writes the clue and answer.</p><div class="pass-card"><div class="player-bubble">${esc(initials(s.name))}</div><div class="small-caps">You're up</div><div class="person-name">${esc(s.name)}</div></div><button class="primary-button" id="open-setter">I'm ${esc(s.name)} — open setter desk →</button></div></section></div></div>`}function setterWriteMarkup(){const s=currentSetter();return `<div class="shell"><div class="game-wrap"><section class="panel game-panel"><div class="game-content"><div class="overline">Private setter desk</div><h1 class="game-heading">Make them think.</h1><p class="game-copy" style="margin-left:0">Write a clue and a two-word rhyming answer. Aim for a fair challenge.</p><form id="setter-form" class="guess-form"><label class="field-label">Your clue</label><input class="input" id="clue-input" maxlength="140" placeholder="e.g. An overweight feline" required><label class="field-label" style="margin-top:1rem">Secret answer</label><input class="input" id="answer-input" maxlength="60" placeholder="e.g. fat cat" required><p class="field-hint">Matching ignores capitalization, punctuation, a/an/the, simple plurals, and word order.</p>${setterError?`<p class="error-message">${esc(setterError)}</p>`:''}<button class="primary-button full" type="submit">Lock answer & start round →</button></form></div></section></div></div>`}function guessHandoffMarkup(){const id=active(),p=by(id);if(!p)return '';return `<div class="shell"><div class="game-wrap"><div class="game-top"><span class="pill">Solved: <strong>${currentRound.solvedIds.length} / ${currentRound.guessOrder.length}</strong></span><span class="pill">${duration}s round</span></div><section class="panel"><div class="game-content center"><div class="big-icon">⏱</div><div class="overline">${currentRound.startedAt===null?'Ready, set, rhyme':'Next guesser'}</div><h1 class="game-heading">Pass to ${esc(p.name)}.</h1><p class="game-copy">${currentRound.startedAt===null?'The timer starts when the clue is opened.':'Their guesses stay private.'}</p><button class="primary-button" id="open-guess">I'm ${esc(p.name)} — reveal clue →</button></div></section></div></div>`}function guessPrivateMarkup(){const p=by(active());return `<div class="shell"><div class="game-wrap"><div class="game-top"><span class="pill">Private turn · ${esc(p.name)}</span><span class="time-box"><span class="timer-value">${fmt(remain())}</span></span></div><div class="timebar"><i style="--timer-progress:${Math.max(0,Math.min(1,remain()/(duration*1000)))}"></i></div><section class="panel"><div class="game-content center"><div class="clue-box"><div class="clue-kicker">Solve this Hink Pink</div><div class="guess-clue">${esc(currentRound.clue)}</div></div><form id="guess-form" class="guess-form"><div class="guess-row"><input class="input" id="guess-input" maxlength="80" placeholder="Type your guess…" autocomplete="off" required><button class="primary-button" type="submit">Guess ↗</button></div><p class="error-message" id="guess-error">${esc(guessError)}</p></form><div class="notice">Guess as many times as you want. If you solve it, you're locked out for the rest of this round.</div></div></section></div></div>`}function revealMarkup(){const s=by(currentRound.setterId),solved=new Set(currentRound.solvedIds),awards=new Map(currentRound.awards.map(a=>[a.playerId,a.points])),rows=guessers().map(p=>{const ok=solved.has(p.id),pts=awards.get(p.id)||0;return `<div class="result-row"><div class="result-player"><div class="result-avatar">${ok?'✓':'—'}</div><div><div class="result-name">${esc(p.name)}</div><div class="result-sub">${ok?'Solved the clue':'Did not solve this round'}</div></div></div><div class="result-points ${ok?'points-chip':'points-muted'}">${ok?'+'+pts:'0'} pts</div></div>`}).join('');return `<div class="shell"><div class="game-wrap"><section class="panel game-panel"><div class="game-content center"><div class="big-icon">★</div><div class="overline">Round ${currentRound.number} complete</div><h1 class="game-heading">The reveal.</h1><div class="answer-reveal"><div class="clue-kicker">${esc(currentRound.clue)}</div><div class="reveal-answer">${esc(currentRound.answer)}</div></div><div class="setter-score"><div><div class="result-name">Setter: ${esc(s.name)}</div><div class="setter-score-label">${currentRound.solvedIds.length} of ${guessers().length} solved</div></div><div class="setter-score-value">+${currentRound.setterPoints} pts</div></div><div class="results-list">${rows}</div><button class="primary-button" id="next-round">${roundIndex+1<totalRounds()?'Next round →':'Final scoreboard →'}</button></div></section></div></div>`}function gameOverMarkup(){const q=players.slice().sort((a,b)=>b.score-a.score||b.setterPoints-a.setterPoints||a.name.localeCompare(b.name)),tie=q.filter(p=>p.score===q[0].score&&p.setterPoints===q[0].setterPoints);return `<div class="shell"><div class="game-wrap"><section class="panel game-panel"><div class="game-content center"><div class="big-icon">🏆</div><div class="overline">That's a wrap</div><h1 class="game-heading">${tie.length>1?'It\'s a tie!':esc(q[0].name)+' takes the crown!'}</h1><p class="game-copy">Ties are broken by total setter points.</p><div class="scoreboard">${q.map((p,i)=>`<div class="scoreboard-row"><div class="score-rank">${i===0?'★':i+1}</div><div><div class="score-player">${esc(p.name)}${i===0?'<span class="winner-tag">Winner</span>':''}</div><div class="score-detail">${p.setterPoints} setter pts · ${p.guesserPoints} guesser pts</div></div><div class="score-total">${p.score}<small>POINTS</small></div></div>`).join('')}</div><button class="primary-button" id="play-again">Play again ↻</button></div></section></div></div>`}function submitClue(e){e.preventDefault();const clue=$('#clue-input').value.trim(),answer=$('#answer-input').value.trim();if(!clue||norm(answer).length!==2){setterError='Enter a clue and an answer that normalizes to exactly two words.';return render()}const s=currentSetter(),pos=players.findIndex(p=>p.id===s.id),go=[];for(let i=1;i<players.length;i++)go.push(players[(pos+i)%players.length].id);currentRound={number:roundIndex+1,setterId:s.id,clue,answer,duration,guessOrder:go,cursor:0,solvedIds:[],awards:[],startedAt:null,ends:null,scored:false,setterPoints:0};guessError='';phase='guess-handoff';render()}function openGuess(){if(!currentRound||active()===null)return reveal('everyone');if(currentRound.startedAt===null)beginTimer();if(remain()<=0)return reveal('time');phase='guess-private';render()}function submitGuess(e){e.preventDefault();if(remain()<=0)return reveal('time');const guess=$('#guess-input').value.trim();if(norm(guess).length!==2){guessError='Enter exactly two words.';return render()}const id=active(),p=by(id);if(correct(guess,currentRound.answer)){const pts=1+Math.round(4*remain()/(currentRound.duration*1000));currentRound.solvedIds.push(id);currentRound.awards.push({playerId:id,points:pts});p.score+=pts;p.guesserPoints+=pts;if(currentRound.solvedIds.length===currentRound.guessOrder.length)return reveal('everyone');phase='guess-handoff';render()}else{guessError='Not quite — try again.';render()}}function reveal(reason){if(!currentRound||currentRound.scored)return;clearTimer();currentRound.scored=true;const p=currentRound.guessOrder.length?currentRound.solvedIds.length/currentRound.guessOrder.length:0,sp=Math.round(24*p*(1-p));currentRound.setterPoints=sp;const s=by(currentRound.setterId);s.score+=sp;s.setterPoints+=sp;history.push({number:currentRound.number,setterName:s.name,clue:currentRound.clue,answer:currentRound.answer,solvedIds:currentRound.solvedIds.slice(),awards:currentRound.awards.slice(),setterPoints:sp,endReason:reason});phase='reveal';render()}function nextRound(){if(roundIndex+1<totalRounds()){roundIndex++;currentRound=null;setterError='';phase='setter-handoff';render()}else{phase='game-over';render()}}function reset(){clearTimer();currentRound=null;order=[];roundIndex=0;history=[];players=players.map(p=>({...p,score:0,setterPoints:0,guesserPoints:0}));phase='setup';render()}function render(){clearTimer();let m='';if(phase==='setup')m=setupMarkup();else if(phase==='setter-handoff')m=setterHandoffMarkup();else if(phase==='setter-write')m=setterWriteMarkup();else if(phase==='guess-handoff')m=guessHandoffMarkup();else if(phase==='guess-private')m=guessPrivateMarkup();else if(phase==='reveal')m=revealMarkup();else if(phase==='game-over')m=gameOverMarkup();appContent.innerHTML=m;if(phase==='setup'){$$('.player-name-input').forEach(i=>i.oninput=()=>by(i.dataset.id).name=i.value);$$('[data-remove]').forEach(b=>b.onclick=()=>{if(players.length>3){players=players.filter(p=>p.id!==b.dataset.remove);render()}});$('#add-player').onclick=addPlayer;$$('[data-duration]').forEach(b=>b.onclick=()=>{duration=+b.dataset.duration;render()});$('#start-game').onclick=startGame}else if(phase==='setter-handoff')$('#open-setter').onclick=()=>{setterError='';phase='setter-write';render()};else if(phase==='setter-write'){$('#setter-form').onsubmit=submitClue;$('#clue-input').focus()}else if(phase==='guess-handoff')$('#open-guess').onclick=openGuess;else if(phase==='guess-private'){$('#guess-form').onsubmit=submitGuess;$('#guess-input').focus();tick() }else if(phase==='reveal')$('#next-round').onclick=nextRound;else if(phase==='game-over')$('#play-again').onclick=reset;if(phase==='guess-private')timerHandle=setInterval(tick,200)}render()})();
</script>
